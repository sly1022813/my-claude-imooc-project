<body>
  <div id="app"></div>
  <div id="toast" class="toast"></div>

  <script>
    // ============ Utils ============
    const Utils = {
      formatDate(date, format = 'date') {
        const d = date instanceof Date ? date : new Date(date);
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const hours = String(d.getHours()).padStart(2, '0');
        const minutes = String(d.getMinutes()).padStart(2, '0');
        switch (format) {
          case 'full': return `${year}年${month}月${day}日`;
          case 'date': return `${year}年${month}月${day}日`;
          case 'datetime': return `${month}-${day} ${hours}:${minutes}`;
          default: return `${year}-${month}-${day}`;
        }
      },
      generateId() {
        return `TX${Date.now()}${Math.random().toString(36).substr(2, 6).toUpperCase()}`;
      },
      validateUsername(username) {
        if (!username || username.length < 3) return { valid: false, message: '用户名至少3个字符' };
        if (username.length > 20) return { valid: false, message: '用户名最多20个字符' };
        if (!/^[a-zA-Z0-9_]+$/.test(username)) return { valid: false, message: '用户名只能包含字母、数字和下划线' };
        return { valid: true, message: '' };
      },
      validatePassword(password) {
        if (!password || password.length < 6) return { valid: false, strength: 'weak', message: '密码至少6个字符' };
        if (password.length < 8) return { valid: true, strength: 'medium', message: '密码强度: 中等' };
        const hasLetter = /[a-zA-Z]/.test(password);
        const hasNumber = /[0-9]/.test(password);
        if (hasLetter && hasNumber) return { valid: true, strength: 'strong', message: '密码强度: 强' };
        return { valid: true, strength: 'medium', message: '密码强度: 中等' };
      },
      simpleHash(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) { hash = ((hash << 5) - hash) + str.charCodeAt(i); hash = hash & hash; }
        return Math.abs(hash).toString(36);
      },
      getMonthStart() { const today = new Date(); return new Date(today.getFullYear(), today.getMonth(), 1); },
      getTodayStart() { const today = new Date(); today.setHours(0, 0, 0, 0); return today; },
      showToast(message, duration = 2000) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), duration);
      },
      storage: {
        get(key, defaultValue = null) {
          try { const item = localStorage.getItem(key); return item ? JSON.parse(item) : defaultValue; }
          catch (e) { return defaultValue; }
        },
        set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; } },
        remove(key) { try { localStorage.removeItem(key); return true; } catch (e) { return false; } }
      }
    };

    // ============ Storage ============
    const Storage = {
      KEYS: { USER: 'light_account_user', RECORDS: 'light_account_records', CUSTOMERS: 'light_account_customers', SUPPLIERS: 'light_account_suppliers', CATEGORIES: 'light_account_categories', SETTINGS: 'light_account_settings', LAST_LOGIN: 'light_account_last_login' },
      DEFAULT_EXPENSE_CATEGORIES: [
        { id: 'exp_1', name: '进货成本', icon: '📦' }, { id: 'exp_2', name: '餐饮成本', icon: '🍜' },
        { id: 'exp_3', name: '房租水电', icon: '💡' }, { id: 'exp_4', name: '员工工资', icon: '💼' },
        { id: 'exp_5', name: '运营费用', icon: '📊' }, { id: 'exp_6', name: '交通物流', icon: '🚚' },
        { id: 'exp_7', name: '办公用品', icon: '📎' }, { id: 'exp_8', name: '税费支出', icon: '🧾' },
        { id: 'exp_9', name: '社交应酬', icon: '☕' }, { id: 'exp_10', name: '其他支出', icon: '✨' }
      ],
      DEFAULT_INCOME_CATEGORIES: [
        { id: 'inc_1', name: '销售收入', icon: '💰' }, { id: 'inc_2', name: '服务收入', icon: '🛒' },
        { id: 'inc_3', name: '其他收入', icon: '🎁' }
      ],
      init() {
        if (!localStorage.getItem(this.KEYS.CATEGORIES)) Utils.storage.set(this.KEYS.CATEGORIES, { expense: this.DEFAULT_EXPENSE_CATEGORIES, income: this.DEFAULT_INCOME_CATEGORIES });
        if (!localStorage.getItem(this.KEYS.SETTINGS)) Utils.storage.set(this.KEYS.SETTINGS, { currency: '¥', defaultPaymentMethod: 'wechat', theme: 'light' });
        if (!localStorage.getItem(this.KEYS.RECORDS)) Utils.storage.set(this.KEYS.RECORDS, []);
        if (!localStorage.getItem(this.KEYS.CUSTOMERS)) Utils.storage.set(this.KEYS.CUSTOMERS, []);
        if (!localStorage.getItem(this.KEYS.SUPPLIERS)) Utils.storage.set(this.KEYS.SUPPLIERS, []);
      },
      getUser() { return Utils.storage.get(this.KEYS.USER, null); },
      setUser(user) { return Utils.storage.set(this.KEYS.USER, user); },
      clearUser() { return Utils.storage.remove(this.KEYS.USER); },
      isLoggedIn() { return this.getUser() !== null; },
      getCategories() { return Utils.storage.get(this.KEYS.CATEGORIES, { expense: this.DEFAULT_EXPENSE_CATEGORIES, income: this.DEFAULT_INCOME_CATEGORIES }); },
      getRecords() { return Utils.storage.get(this.KEYS.RECORDS, []); },
      setRecords(records) { return Utils.storage.set(this.KEYS.RECORDS, records); },
      addRecord(record) { const records = this.getRecords(); records.unshift({ ...record, id: record.id || Utils.generateId(), createdAt: record.createdAt || new Date().toISOString() }); this.setRecords(records); return record; },
      getCustomers() { return Utils.storage.get(this.KEYS.CUSTOMERS, []); },
      getSuppliers() { return Utils.storage.get(this.KEYS.SUPPLIERS, []); },
      getSettings() { return Utils.storage.get(this.KEYS.SETTINGS, {}); },
      getMonthRecords() { const monthStart = Utils.getMonthStart(); return this.getRecords().filter(r => new Date(r.createdAt) >= monthStart); },
      getStatistics() {
        const monthRecords = this.getMonthRecords();
        const totalIncome = monthRecords.filter(r => r.type === 'income').reduce((sum, r) => sum + parseFloat(r.amount), 0);
        const totalExpense = monthRecords.filter(r => r.type === 'expense').reduce((sum, r) => sum + parseFloat(r.amount), 0);
        return { totalIncome, totalExpense, balance: totalIncome - totalExpense, monthRecordCount: monthRecords.length, totalRecordCount: this.getRecords().length };
      },
      register(username, password, userType = 'personal') {
        const users = Utils.storage.get(this.KEYS.LAST_LOGIN, []);
        if (users.find(u => u.username === username)) return { success: false, message: '用户名已存在' };
        const newUser = { id: Utils.generateId(), username, passwordHash: Utils.simpleHash(password), userType, createdAt: new Date().toISOString() };
        users.push(newUser); Utils.storage.set(this.KEYS.LAST_LOGIN, users);
        this.setUser({ id: newUser.id, username: newUser.username, userType: newUser.userType });
        return { success: true, message: '注册成功' };
      },
      login(username, password) {
        const users = Utils.storage.get(this.KEYS.LAST_LOGIN, []);
        const user = users.find(u => u.username === username);
        if (!user) return { success: false, message: '用户不存在' };
        if (user.passwordHash !== Utils.simpleHash(password)) return { success: false, message: '密码错误' };
        this.setUser({ id: user.id, username: user.username, userType: user.userType });
        return { success: true, message: '登录成功' };
      },
      addCustomer(customer) { const customers = this.getCustomers(); const newCustomer = { ...customer, id: Utils.generateId(), createdAt: new Date().toISOString() }; customers.push(newCustomer); Utils.storage.set(this.KEYS.CUSTOMERS, customers); return newCustomer; },
      updateCustomer(id, updates) { const customers = this.getCustomers(); const idx = customers.findIndex(c => c.id === id); if (idx !== -1) { customers[idx] = { ...customers[idx], ...updates }; Utils.storage.set(this.KEYS.CUSTOMERS, customers); return customers[idx]; } return null; },
      deleteCustomer(id) { const customers = this.getCustomers().filter(c => c.id !== id); Utils.storage.set(this.KEYS.CUSTOMERS, customers); },
      addSupplier(supplier) { const suppliers = this.getSuppliers(); const newSupplier = { ...supplier, id: Utils.generateId(), createdAt: new Date().toISOString() }; suppliers.push(newSupplier); Utils.storage.set(this.KEYS.SUPPLIERS, suppliers); return newSupplier; },
      updateSupplier(id, updates) { const suppliers = this.getSuppliers(); const idx = suppliers.findIndex(s => s.id === id); if (idx !== -1) { suppliers[idx] = { ...suppliers[idx], ...updates }; Utils.storage.set(this.KEYS.SUPPLIERS, suppliers); return suppliers[idx]; } return null; },
      deleteSupplier(id) { const suppliers = this.getSuppliers().filter(s => s.id !== id); Utils.storage.set(this.KEYS.SUPPLIERS, suppliers); },
      exportData() { return { version: '1.0', exportDate: new Date().toISOString(), records: this.getRecords(), customers: this.getCustomers(), categories: this.getCategories(), settings: this.getSettings() }; },
      importData(data) {
        try { if (data.records) this.setRecords(data.records); if (data.customers) Utils.storage.set(this.KEYS.CUSTOMERS, data.customers); return { success: true, message: '数据导入成功' }; }
        catch (e) { return { success: false, message: '数据导入失败' }; }
      }
    };
    Storage.init();

    // ============ Router ============
    const Router = {
      routes: {},
      currentRoute: null,
      setGuard(guard) { this.guard = guard; },
      register(path, handler) { this.routes[path] = handler; },
      navigate(path) { if (this.guard && !this.guard(path)) return false; window.location.hash = path; return true; },
      getCurrentRoute() { return (window.location.hash.slice(1) || 'login').split('?')[0]; },
      handleRoute() {
        const path = this.getCurrentRoute();
        if (this.guard && !this.guard(path)) return;
        this.currentRoute = path;
        if (this.routes[path]) this.routes[path]();
        else { if (Storage.isLoggedIn()) this.navigate('dashboard'); else this.navigate('login'); }
      },
      init() { window.addEventListener('hashchange', () => this.handleRoute()); this.handleRoute(); }
    };

        document.querySelectorAll('#type-toggle .segmented-item').forEach(btn => {

            document.querySelectorAll('#type-toggle .segmented-item').forEach(b => b.classList.remove('active'));

            document.getElementById('category-grid').innerHTML = cats.map((cat, i) => `<button type="button" class="category-btn ${i === 0 ? 'selected' : ''}" data-category="${cat.name}" data-icon="${cat.icon}" data-type="${currentType}"><span class="text-2xl mb-1">${cat.icon}</span><span class="text-sm font-medium">${cat.name}</span></button>`).join('');

          });

        this.bindCategorySelection();

          btn.addEventListener('click', () => { document.getElementById('amount-input').value = parseFloat(btn.dataset.amount).toFixed(2); });

        const reader = new FileReader();
        reader.onload = (e) => {
          try { const data = JSON.parse(e.target.result); const result = Storage.importData(data); Utils.showToast(result.message); if (result.success) Router.navigate('dashboard'); }
          catch { Utils.showToast('文件格式错误'); }
        };
        reader.readAsText(file);
      }
    };

    // Initialize
    document.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>
