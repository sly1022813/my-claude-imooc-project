<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客户 - 轻记账</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#9b3f5a",
            "income-mint": "#7ED7C1",
            "expense-coral": "#FF6B6B",
            "pending-amber": "#FFB347",
            "surface-cream": "#FFF5F7",
            "surface-card": "#FFFFFF",
            "border-soft": "#FFE4E8",
            "text-secondary": "#666666",
            "text-muted": "#999999",
            "on-primary": "#ffffff",
            "on-surface": "#1b1c1c",
            "surface-container-lowest": "#ffffff",
            "surface-container": "#f0eded",
            "secondary-fixed": "#ffd9e1",
            "secondary-container": "#fdb2c5",
            "on-secondary-container": "#7a4151",
            "on-surface-variant": "#544245",
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'Space Mono', monospace; }
    .material-symbols-outlined { font-family: 'Material Symbols Outlined'; }
  </style>
</head>
<body class="bg-surface-cream text-on-surface min-h-screen pb-20">
  <!-- Header -->
  <header class="bg-surface-card border-b border-border-soft px-4 py-3 sticky top-0 z-50">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="font-semibold text-lg">客户 & 供应商</span>
      </div>
      <button class="p-2 -mr-2 hover:bg-surface-cream rounded-full" onclick="showAddModal()">
        <span class="material-symbols-outlined text-xl text-primary">add_circle</span>
      </button>
    </div>
  </header>

  <!-- Tab Navigation -->
  <div class="max-w-2xl mx-auto px-4 pt-4">
    <div class="flex p-1 bg-surface-card rounded-full border border-border-soft">
      <button class="flex-1 py-2 text-center rounded-full font-semibold text-sm transition-all bg-primary text-white" id="tab-customers" onclick="switchTab('customers')">
        客户
      </button>
      <button class="flex-1 py-2 text-center rounded-full font-semibold text-sm transition-all text-text-secondary" id="tab-suppliers" onclick="switchTab('suppliers')">
        供应商
      </button>
    </div>
  </div>

  <!-- Search Bar -->
  <div class="max-w-2xl mx-auto px-4 pt-4">
    <div class="relative flex items-center">
      <span class="material-symbols-outlined absolute left-3 text-text-muted">search</span>
      <input type="text" id="search-input" class="w-full h-11 pl-10 pr-4 rounded-full bg-surface-card border border-border-soft outline-none focus:border-primary transition-colors"
             placeholder="搜索名称/电话..." oninput="handleSearch()">
    </div>
  </div>

  <!-- Main Content -->
  <main class="max-w-2xl mx-auto px-4 pt-4">
    <!-- List -->
    <section class="space-y-3" id="list-container">
      <div class="p-8 text-center text-text-muted">
        <span class="material-symbols-outlined text-4xl animate-pulse">hourglass_empty</span>
        <p class="mt-2">加载中...</p>
      </div>
    </section>
  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 bg-surface-card border-t border-border-soft">
    <div class="max-w-2xl mx-auto flex justify-around py-2">
      <a href="index.html" class="flex flex-col items-center p-2 text-text-secondary">
        <span class="material-symbols-outlined text-2xl">home</span>
        <span class="text-xs mt-1">首页</span>
      </a>
      <a href="records.html" class="flex flex-col items-center p-2 text-text-secondary">
        <span class="material-symbols-outlined text-2xl">receipt_long</span>
        <span class="text-xs mt-1">记录</span>
      </a>
      <a href="#" class="flex flex-col items-center p-2 -mt-6">
        <div class="w-14 h-14 rounded-full bg-primary flex items-center justify-center shadow-lg">
          <span class="material-symbols-outlined text-3xl text-white">add</span>
        </div>
      </a>
      <a href="customers.html" class="flex flex-col items-center p-2 text-primary">
        <span class="material-symbols-outlined text-2xl">group</span>
        <span class="text-xs mt-1">客户</span>
      </a>
      <a href="mine.html" class="flex flex-col items-center p-2 text-text-secondary">
        <span class="material-symbols-outlined text-2xl">person</span>
        <span class="text-xs mt-1">我的</span>
      </a>
    </div>
  </nav>

  <!-- Add/Edit Modal -->
  <div id="add-modal" class="fixed inset-0 bg-black/50 z-50 hidden">
    <div class="absolute bottom-0 left-0 right-0 bg-surface-card rounded-t-2xl max-h-[90vh] overflow-y-auto">
      <div class="sticky top-0 bg-surface-card p-4 border-b border-border-soft flex items-center justify-between">
        <h3 class="font-semibold text-lg" id="modal-title">添加客户</h3>
        <button onclick="closeAddModal()" class="p-2 hover:bg-surface-cream rounded-full">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <form class="p-4 space-y-4" id="customer-form">
        <input type="hidden" id="customer-id" value="">
        <input type="hidden" id="customer-type" value="1">

        <!-- Name -->
        <div>
          <label class="block text-sm font-medium text-text-secondary mb-2">名称 *</label>
          <input type="text" id="customer-name" class="w-full h-12 px-4 rounded-lg bg-surface-cream border border-border-soft outline-none focus:border-primary"
                 placeholder="输入名称" required>
        </div>

        <!-- Phone -->
        <div>
          <label class="block text-sm font-medium text-text-secondary mb-2">电话</label>
          <input type="tel" id="customer-phone" class="w-full h-12 px-4 rounded-lg bg-surface-cream border border-border-soft outline-none focus:border-primary"
                 placeholder="输入手机号">
        </div>

        <!-- Address -->
        <div>
          <label class="block text-sm font-medium text-text-secondary mb-2">地址</label>
          <input type="text" id="customer-address" class="w-full h-12 px-4 rounded-lg bg-surface-cream border border-border-soft outline-none focus:border-primary"
                 placeholder="输入地址">
        </div>

        <!-- Remark -->
        <div>
          <label class="block text-sm font-medium text-text-secondary mb-2">备注</label>
          <textarea id="customer-remark" rows="3" class="w-full px-4 py-3 rounded-lg bg-surface-cream border border-border-soft outline-none focus:border-primary resize-none"
                    placeholder="添加备注..."></textarea>
        </div>

        <!-- Submit -->
        <button type="submit" class="w-full h-14 rounded-xl bg-primary text-white font-semibold text-lg shadow-md active:scale-95 transition-all" id="submit-btn">
          保存
        </button>
      </form>
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="detail-modal" class="fixed inset-0 bg-black/50 z-50 hidden">
    <div class="absolute bottom-0 left-0 right-0 bg-surface-card rounded-t-2xl max-h-[90vh] overflow-y-auto">
      <div class="sticky top-0 bg-surface-card p-4 border-b border-border-soft flex items-center justify-between">
        <h3 class="font-semibold text-lg">详情</h3>
        <button onclick="closeDetailModal()" class="p-2 hover:bg-surface-cream rounded-full">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="p-4" id="detail-content"></div>
      <div class="sticky bottom-0 bg-surface-card p-4 border-t border-border-soft flex gap-3">
        <button class="flex-1 h-12 rounded-xl bg-expense-coral text-white font-semibold" onclick="deleteCustomer()">删除</button>
        <button class="flex-1 h-12 rounded-xl bg-primary text-white font-semibold" onclick="editCustomer()">编辑</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none;"></div>

  <!-- Scripts -->
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    let currentTab = 'customers'; // customers | suppliers
    let currentList = [];
    let currentCustomerId = null;
    let searchTimeout = null;

    // ============ Toast ============
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgColors = {
        success: 'bg-income-mint',
        error: 'bg-expense-coral',
        warning: 'bg-pending-amber',
        info: 'bg-primary'
      };
      toast.className = `${bgColors[type]} text-white px-4 py-2 rounded-lg shadow-lg text-sm font-medium transition-all duration-300`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // ============ Check Auth ============
    function checkAuth() {
      if (!API.isLoggedIn()) {
        window.location.href = 'login.html';
        return false;
      }
      return true;
    }

    // ============ Tab Switching ============
    function switchTab(tab) {
      currentTab = tab;

      const customersTab = document.getElementById('tab-customers');
      const suppliersTab = document.getElementById('tab-suppliers');

      if (tab === 'customers') {
        customersTab.classList.add('bg-primary', 'text-white');
        customersTab.classList.remove('text-text-secondary');
        suppliersTab.classList.remove('bg-primary', 'text-white');
        suppliersTab.classList.add('text-text-secondary');
      } else {
        suppliersTab.classList.add('bg-primary', 'text-white');
        suppliersTab.classList.remove('text-text-secondary');
        customersTab.classList.remove('bg-primary', 'text-white');
        customersTab.classList.add('text-text-secondary');
      }

      document.getElementById('search-input').value = '';
      loadList();
    }

    // ============ Load List ============
    async function loadList(search = '') {
      const container = document.getElementById('list-container');
      container.innerHTML = `
        <div class="p-8 text-center text-text-muted">
          <span class="material-symbols-outlined text-4xl animate-pulse">hourglass_empty</span>
          <p class="mt-2">加载中...</p>
        </div>
      `;

      try {
        const params = {};
        if (search) params.keyword = search;

        let res;
        if (currentTab === 'customers') {
          res = await API.Customer.getList(params);
        } else {
          res = await API.Supplier.getList(params);
        }

        currentList = res.data.list;

        if (currentList.length === 0) {
          container.innerHTML = `
            <div class="bg-surface-card rounded-xl p-8 text-center text-text-muted">
              <span class="material-symbols-outlined text-4xl">person_add</span>
              <p class="mt-2">暂无${currentTab === 'customers' ? '客户' : '供应商'}</p>
              <button class="mt-4 px-4 py-2 rounded-lg bg-primary text-white text-sm" onclick="showAddModal()">
                添加${currentTab === 'customers' ? '客户' : '供应商'}
              </button>
            </div>
          `;
          return;
        }

        container.innerHTML = currentList.map(item => `
          <div class="bg-surface-card rounded-xl p-4 border border-border-soft hover:bg-surface-cream/50 cursor-pointer transition-colors"
               onclick="showDetail(${item.id})">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-full bg-secondary-fixed flex items-center justify-center">
                <span class="material-symbols-outlined text-2xl text-primary">${currentTab === 'customers' ? 'person' : 'local_shipping'}</span>
              </div>
              <div class="flex-1 min-w-0">
                <div class="font-semibold truncate">${item.name}</div>
                <div class="text-sm text-text-muted">${item.phone || '无电话'}</div>
              </div>
              <div class="text-right">
                <div class="text-sm ${item.balance >= 0 ? 'text-income-mint' : 'text-expense-coral'}">
                  ${item.balance >= 0 ? '应收' : '应付'} ¥${Utils.formatAmount(Math.abs(item.balance))}
                </div>
                <div class="text-xs text-text-muted">${item.transaction_count || 0} 笔交易</div>
              </div>
              <span class="material-symbols-outlined text-text-muted">chevron_right</span>
            </div>
          </div>
        `).join('');
      } catch (e) {
        console.error('加载失败:', e);
        container.innerHTML = `
          <div class="p-8 text-center text-expense-coral">
            <span class="material-symbols-outlined text-4xl">error</span>
            <p class="mt-2">加载失败: ${e.message}</p>
          </div>
        `;
      }
    }

    // ============ Search ============
    function handleSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        const search = document.getElementById('search-input').value.trim();
        loadList(search);
      }, 300);
    }

    // ============ Add/Edit Modal ============
    function showAddModal(id = null) {
      document.getElementById('customer-id').value = id || '';
      document.getElementById('customer-type').value = currentTab === 'customers' ? 1 : 2;
      document.getElementById('customer-name').value = '';
      document.getElementById('customer-phone').value = '';
      document.getElementById('customer-address').value = '';
      document.getElementById('customer-remark').value = '';

      document.getElementById('modal-title').textContent = id ? '编辑' + (currentTab === 'customers' ? '客户' : '供应商') : '添加' + (currentTab === 'customers' ? '客户' : '供应商');
      document.getElementById('add-modal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeAddModal() {
      document.getElementById('add-modal').classList.add('hidden');
      document.body.style.overflow = '';
    }

    // Load customer data for editing
    async function loadCustomerForEdit(id) {
      try {
        let res;
        if (currentTab === 'customers') {
          res = await API.Customer.getById(id);
        } else {
          res = await API.Supplier.getById(id);
        }

        const item = res.data;
        document.getElementById('customer-id').value = item.id;
        document.getElementById('customer-name').value = item.name;
        document.getElementById('customer-phone').value = item.phone || '';
        document.getElementById('customer-address').value = item.address || '';
        document.getElementById('customer-remark').value = item.remark || '';

        document.getElementById('modal-title').textContent = '编辑' + (currentTab === 'customers' ? '客户' : '供应商');
        document.getElementById('add-modal').classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      } catch (e) {
        showToast('加载失败', 'error');
      }
    }

    // Form submit
    document.getElementById('customer-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const id = document.getElementById('customer-id').value;
      const data = {
        name: document.getElementById('customer-name').value.trim(),
        phone: document.getElementById('customer-phone').value.trim() || null,
        address: document.getElementById('customer-address').value.trim() || null,
        remark: document.getElementById('customer-remark').value.trim() || null
      };

      if (!data.name) {
        showToast('请输入名称', 'error');
        return;
      }

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = '保存中...';

      try {
        if (id) {
          if (currentTab === 'customers') {
            await API.Customer.update(id, data);
          } else {
            await API.Supplier.update(id, data);
          }
          showToast('更新成功', 'success');
        } else {
          if (currentTab === 'customers') {
            await API.Customer.create(data);
          } else {
            await API.Supplier.create(data);
          }
          showToast('添加成功', 'success');
        }

        closeAddModal();
        loadList();
      } catch (e) {
        showToast(e.message, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '保存';
      }
    });

    // ============ Detail Modal ============
    async function showDetail(id) {
      currentCustomerId = id;

      try {
        let res, transactionsRes, item;
        if (currentTab === 'customers') {
          res = await API.Customer.getById(id);
          transactionsRes = await API.Customer.getTransactions(id, { pageSize: 5 });
          item = res.data;
        } else {
          res = await API.Supplier.getById(id);
          transactionsRes = await API.Supplier.getTransactions(id, { pageSize: 5 });
          item = res.data;
        }

        const transactions = transactionsRes.data.list || [];

        document.getElementById('detail-content').innerHTML = `
          <div class="text-center py-4">
            <div class="w-16 h-16 rounded-full mx-auto bg-secondary-fixed flex items-center justify-center mb-3">
              <span class="material-symbols-outlined text-3xl text-primary">${currentTab === 'customers' ? 'person' : 'local_shipping'}</span>
            </div>
            <div class="font-semibold text-lg">${item.name}</div>
            <div class="text-sm text-text-muted">${item.phone || '无电话'}</div>
          </div>

          <div class="grid grid-cols-3 gap-3 mb-4">
            <div class="bg-surface-cream rounded-lg p-3 text-center">
              <div class="text-lg font-bold font-mono ${item.total_income > 0 ? 'text-income-mint' : 'text-text-muted'}">¥${Utils.formatAmount(item.total_income || 0)}</div>
              <div class="text-xs text-text-muted">累计收入</div>
            </div>
            <div class="bg-surface-cream rounded-lg p-3 text-center">
              <div class="text-lg font-bold font-mono ${item.total_expense > 0 ? 'text-expense-coral' : 'text-text-muted'}">¥${Utils.formatAmount(item.total_expense || 0)}</div>
              <div class="text-xs text-text-muted">累计支出</div>
            </div>
            <div class="bg-surface-cream rounded-lg p-3 text-center">
              <div class="text-lg font-bold font-mono ${item.balance >= 0 ? 'text-income-mint' : 'text-expense-coral'}">¥${Utils.formatAmount(Math.abs(item.balance || 0))}</div>
              <div class="text-xs text-text-muted">${item.balance >= 0 ? '应收' : '应付'}</div>
            </div>
          </div>

          ${item.address ? `
          <div class="flex items-center gap-2 py-2 border-b border-border-soft">
            <span class="material-symbols-outlined text-text-muted">location_on</span>
            <span class="text-sm">${item.address}</span>
          </div>
          ` : ''}

          ${item.remark ? `
          <div class="flex items-start gap-2 py-2 border-b border-border-soft">
            <span class="material-symbols-outlined text-text-muted">notes</span>
            <span class="text-sm">${item.remark}</span>
          </div>
          ` : ''}

          <div class="mt-4">
            <div class="flex items-center justify-between mb-2">
              <span class="font-semibold">最近交易</span>
              <span class="text-xs text-text-muted">${item.transaction_count || 0} 笔</span>
            </div>
            ${transactions.length === 0 ? `
              <div class="text-center py-4 text-text-muted text-sm">暂无交易记录</div>
            ` : `
              <div class="space-y-2">
                ${transactions.map(tx => `
                  <div class="flex items-center justify-between py-2 border-b border-border-soft last:border-b-0">
                    <div class="flex items-center gap-2">
                      <span class="text-sm ${tx.type === 1 ? 'text-expense-coral' : 'text-income-mint'}">${tx.type === 1 ? '-' : '+'}¥${Utils.formatAmount(tx.amount)}</span>
                      <span class="text-xs text-text-muted">${tx.date}</span>
                    </div>
                    <span class="text-xs text-text-muted">${tx.category_name}</span>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        `;

        document.getElementById('detail-modal').classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      } catch (e) {
        showToast('加载失败', 'error');
      }
    }

    function closeDetailModal() {
      document.getElementById('detail-modal').classList.add('hidden');
      document.body.style.overflow = '';
      currentCustomerId = null;
    }

    function editCustomer() {
      if (!currentCustomerId) return;
      closeDetailModal();
      loadCustomerForEdit(currentCustomerId);
    }

    async function deleteCustomer() {
      if (!currentCustomerId) return;

      const confirmed = await Utils.confirm(`确定要删除这个${currentTab === 'customers' ? '客户' : '供应商'}吗？`);
      if (!confirmed) return;

      try {
        if (currentTab === 'customers') {
          await API.Customer.delete(currentCustomerId);
        } else {
          await API.Supplier.delete(currentCustomerId);
        }
        showToast('删除成功', 'success');
        closeDetailModal();
        loadList();
      } catch (e) {
        showToast('删除失败: ' + e.message, 'error');
      }
    }

    // ============ Initialize ============
    document.addEventListener('DOMContentLoaded', () => {
      if (!checkAuth()) return;
      loadList();
    });
  </script>
</body>
</html>
