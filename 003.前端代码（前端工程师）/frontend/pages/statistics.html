<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>统计报表 - 轻记账</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#9b3f5a",
            "income-mint": "#7ED7C1",
            "expense-coral": "#FF6B6B",
            "pending-amber": "#FFB347",
            "surface-cream": "#FFF5F7",
            "surface-card": "#FFFFFF",
            "border-soft": "#FFE4E8",
            "text-secondary": "#666666",
            "text-muted": "#999999",
            "on-primary": "#ffffff",
            "on-surface": "#1b1c1c",
            "surface-container-lowest": "#ffffff",
            "surface-container": "#f0eded",
            "secondary-fixed": "#ffd9e1",
            "secondary-container": "#fdb2c5",
            "on-secondary-container": "#7a4151",
            "on-surface-variant": "#544245",
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'Space Mono', monospace; }
    .material-symbols-outlined { font-family: 'Material Symbols Outlined'; }
  </style>
</head>
<body class="bg-surface-cream text-on-surface min-h-screen pb-20">
  <!-- Header -->
  <header class="bg-surface-card border-b border-border-soft px-4 py-3 sticky top-0 z-50">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <a href="index.html" class="p-2 -ml-2 hover:bg-surface-cream rounded-full">
        <span class="material-symbols-outlined text-xl text-on-surface-variant">arrow_back</span>
      </a>
      <h1 class="font-semibold text-lg">统计分析</h1>
      <button class="p-2 -mr-2 hover:bg-surface-cream rounded-full" onclick="exportExcel()" title="导出Excel">
        <span class="material-symbols-outlined text-xl text-on-surface-variant">download</span>
      </button>
    </div>
  </header>

  <!-- Year Selector -->
  <div class="max-w-2xl mx-auto px-4 py-4">
    <div class="flex items-center justify-center gap-4">
      <button class="p-2 rounded-full hover:bg-surface-card" onclick="changeYear(-1)">
        <span class="material-symbols-outlined text-xl">chevron_left</span>
      </button>
      <select id="year-selector" class="px-4 py-2 rounded-lg bg-surface-card border border-border-soft outline-none font-semibold text-lg" onchange="loadData()">
        <!-- 年份选项由JS生成 -->
      </select>
      <button class="p-2 rounded-full hover:bg-surface-card" onclick="changeYear(1)">
        <span class="material-symbols-outlined text-xl">chevron_right</span>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <main class="max-w-2xl mx-auto px-4 space-y-4">
    <!-- Summary Cards -->
    <section class="grid grid-cols-2 gap-3">
      <div class="bg-surface-card rounded-xl p-4 border border-border-soft">
        <div class="flex items-center gap-2 mb-2">
          <span class="material-symbols-outlined text-lg text-income-mint">arrow_downward</span>
          <span class="text-xs text-text-secondary">年度收入</span>
        </div>
        <div class="text-xl font-bold font-mono text-income-mint" id="stat-income">¥0.00</div>
      </div>
      <div class="bg-surface-card rounded-xl p-4 border border-border-soft">
        <div class="flex items-center gap-2 mb-2">
          <span class="material-symbols-outlined text-lg text-expense-coral">arrow_outward</span>
          <span class="text-xs text-text-secondary">年度支出</span>
        </div>
        <div class="text-xl font-bold font-mono text-expense-coral" id="stat-expense">¥0.00</div>
      </div>
    </section>

    <!-- Net Profit -->
    <section class="bg-surface-card rounded-xl p-4 border-2 border-primary">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-2xl text-primary">account_balance_wallet</span>
          <span class="font-medium">年度结余</span>
        </div>
        <div class="text-2xl font-bold font-mono text-primary" id="stat-profit">¥0.00</div>
      </div>
    </section>

    <!-- Expense Pie Chart -->
    <section class="bg-surface-card rounded-xl p-4 border border-border-soft">
      <h3 class="font-semibold mb-3">支出分类</h3>
      <div class="h-64">
        <canvas id="expenseChart"></canvas>
      </div>
    </section>

    <!-- Monthly Trend Line Chart -->
    <section class="bg-surface-card rounded-xl p-4 border border-border-soft">
      <h3 class="font-semibold mb-3">收支趋势（1-12月）</h3>
      <div class="h-64">
        <canvas id="monthlyTrendChart"></canvas>
      </div>
    </section>

    <!-- Category Breakdown -->
    <section class="bg-surface-card rounded-xl border border-border-soft overflow-hidden">
      <div class="p-4 border-b border-border-soft">
        <h3 class="font-semibold">支出分类明细</h3>
      </div>
      <div id="category-breakdown">
        <div class="p-8 text-center text-text-muted">
          <span class="material-symbols-outlined text-4xl">pie_chart</span>
          <p class="mt-2">加载中...</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 bg-surface-card border-t border-border-soft">
    <div class="max-w-2xl mx-auto flex justify-around py-2">
      <a href="index.html" class="flex flex-col items-center p-2 text-text-secondary">
        <span class="material-symbols-outlined text-2xl">home</span>
        <span class="text-xs mt-1">首页</span>
      </a>
      <a href="records.html" class="flex flex-col items-center p-2 text-text-secondary">
        <span class="material-symbols-outlined text-2xl">receipt_long</span>
        <span class="text-xs mt-1">记录</span>
      </a>
      <a href="#" class="flex flex-col items-center p-2 -mt-6">
        <div class="w-14 h-14 rounded-full bg-primary flex items-center justify-center shadow-lg">
          <span class="material-symbols-outlined text-3xl text-white">add</span>
        </div>
      </a>
      <a href="customers.html" class="flex flex-col items-center p-2 text-text-secondary">
        <span class="material-symbols-outlined text-2xl">group</span>
        <span class="text-xs mt-1">客户</span>
      </a>
      <a href="mine.html" class="flex flex-col items-center p-2 text-text-secondary">
        <span class="material-symbols-outlined text-2xl">person</span>
        <span class="text-xs mt-1">我的</span>
      </a>
    </div>
  </nav>

  <!-- Toast Container -->
  <div id="toast-container" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none;"></div>

  <!-- Scripts -->
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    let currentYear = new Date().getFullYear();
    let expenseChart = null;
    let monthlyTrendChart = null;
    let yearlyStatsData = null;
    let monthlyTrendData = null;

    // ============ Toast ============
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgColors = {
        success: 'bg-income-mint',
        error: 'bg-expense-coral',
        warning: 'bg-pending-amber',
        info: 'bg-primary'
      };
      toast.className = `${bgColors[type]} text-white px-4 py-2 rounded-lg shadow-lg text-sm font-medium transition-all duration-300`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // ============ Check Auth ============
    function checkAuth() {
      if (!API.isLoggedIn()) {
        window.location.href = 'login.html';
        return false;
      }
      return true;
    }

    // ============ Year Selector ============
    function initYearSelector() {
      const select = document.getElementById('year-selector');
      const currentYear = new Date().getFullYear();
      let options = '';
      for (let y = currentYear; y >= currentYear - 5; y--) {
        options += `<option value="${y}" ${y === currentYear ? 'selected' : ''}>${y}年</option>`;
      }
      select.innerHTML = options;
    }

    function changeYear(delta) {
      const select = document.getElementById('year-selector');
      const newYear = currentYear + delta;
      if (newYear >= new Date().getFullYear() - 5 && newYear <= new Date().getFullYear()) {
        select.value = newYear;
        loadData();
      }
    }

    // ============ Load Data ============
    async function loadData() {
      if (!checkAuth()) return;

      currentYear = parseInt(document.getElementById('year-selector').value);

      try {
        // 并行加载年度统计和月度趋势
        const [statsRes, trendRes] = await Promise.all([
          API.Transaction.getYearlyStats(currentYear),
          API.Transaction.getYearlyMonthlyTrend(currentYear)
        ]);

        yearlyStatsData = statsRes.data;
        monthlyTrendData = trendRes.data;

        // 更新汇总数据
        document.getElementById('stat-income').textContent = `¥${Utils.formatAmount(yearlyStatsData.totalIncome)}`;
        document.getElementById('stat-expense').textContent = `¥${Utils.formatAmount(yearlyStatsData.totalExpense)}`;
        document.getElementById('stat-profit').textContent = `¥${Utils.formatAmount(yearlyStatsData.netProfit)}`;

        // 加载图表
        loadExpenseChart(yearlyStatsData.expenseByCategory);
        loadMonthlyTrendChart(monthlyTrendData.data);
        loadCategoryBreakdown(yearlyStatsData.expenseByCategory, yearlyStatsData.totalExpense);

      } catch (e) {
        console.error('加载数据失败:', e);
        showToast('加载数据失败', 'error');
      }
    }

    function loadExpenseChart(data) {
      if (!data || data.length === 0) {
        document.getElementById('expenseChart').parentElement.innerHTML = `
          <div class="h-64 flex items-center justify-center text-text-muted">
            <div class="text-center">
              <span class="material-symbols-outlined text-4xl">pie_chart</span>
              <p class="mt-2">暂无支出数据</p>
            </div>
          </div>
        `;
        return;
      }

      if (expenseChart) expenseChart.destroy();

      const ctx = document.getElementById('expenseChart').getContext('2d');
      expenseChart = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: data.map(d => d.category_name),
          datasets: [{
            data: data.map(d => parseFloat(d.total)),
            backgroundColor: data.map(d => d.category_color || '#FF6B6B'),
            borderWidth: 2,
            borderColor: '#ffffff'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { usePointStyle: true, padding: 15, font: { size: 12 } }
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  const value = context.raw;
                  const total = context.dataset.data.reduce((a, b) => a + b, 0);
                  const percent = ((value / total) * 100).toFixed(1);
                  return `${context.label}: ¥${Utils.formatAmount(value)} (${percent}%)`;
                }
              }
            }
          }
        }
      });
    }

    function loadMonthlyTrendChart(data) {
      if (monthlyTrendChart) monthlyTrendChart.destroy();

      const ctx = document.getElementById('monthlyTrendChart').getContext('2d');
      monthlyTrendChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: data.map(d => d.month_name),
          datasets: [
            {
              label: '支出',
              data: data.map(d => d.monthly_expense),
              borderColor: '#FF6B6B',
              backgroundColor: 'rgba(255, 107, 107, 0.1)',
              fill: true,
              tension: 0.4
            },
            {
              label: '收入',
              data: data.map(d => d.monthly_income),
              borderColor: '#7ED7C1',
              backgroundColor: 'rgba(126, 215, 193, 0.1)',
              fill: true,
              tension: 0.4
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { usePointStyle: true }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: { callback: v => '¥' + v }
            }
          }
        }
      });
    }

    function loadCategoryBreakdown(data, totalExpense) {
      const container = document.getElementById('category-breakdown');

      if (!data || data.length === 0) {
        container.innerHTML = `
          <div class="p-8 text-center text-text-muted">
            <span class="material-symbols-outlined text-4xl">pie_chart</span>
            <p class="mt-2">暂无分类数据</p>
          </div>
        `;
        return;
      }

      container.innerHTML = data.map(c => {
        const percent = totalExpense > 0 ? (parseFloat(c.total) / totalExpense * 100).toFixed(1) : 0;
        return `
          <div class="flex items-center gap-3 p-4 border-b border-border-soft last:border-b-0 hover:bg-surface-cream/50">
            <div class="w-12 h-12 rounded-full flex items-center justify-center text-xl" style="background-color: ${c.category_color}20">
              ${c.category_icon}
            </div>
            <div class="flex-1">
              <div class="flex justify-between text-sm mb-1">
                <span>${c.category_name}</span>
                <span class="font-mono font-semibold text-expense-coral">¥${Utils.formatAmount(c.total)}</span>
              </div>
              <div class="h-2 bg-surface-cream rounded-full overflow-hidden">
                <div class="h-full bg-expense-coral rounded-full" style="width: ${percent}%"></div>
              </div>
            </div>
            <span class="text-xs text-text-muted w-12 text-right">${percent}%</span>
          </div>
        `;
      }).join('');
    }

    // ============ Export Excel ============
    function exportExcel() {
      if (!yearlyStatsData || !monthlyTrendData) {
        showToast('请先加载数据', 'warning');
        return;
      }

      try {
        const wb = XLSX.utils.book_new();

        // 1. 年度汇总表
        const summaryData = [
          ['项目', '金额'],
          ['年度收入', yearlyStatsData.totalIncome],
          ['年度支出', yearlyStatsData.totalExpense],
          ['年度结余', yearlyStatsData.netProfit],
          ['收入笔数', yearlyStatsData.incomeCount || 0],
          ['支出笔数', yearlyStatsData.expenseCount || 0]
        ];
        const summarySheet = XLSX.utils.aoa_to_sheet(summaryData);
        summarySheet['!cols'] = [{ wch: 15 }, { wch: 20 }];
        XLSX.utils.book_append_sheet(wb, summarySheet, '年度汇总');

        // 2. 月度趋势表
        const trendHeader = ['月份', '收入', '支出', '结余'];
        const trendData = monthlyTrendData.data.map(d => [
          d.month_name,
          d.monthly_income,
          d.monthly_expense,
          d.monthly_profit
        ]);
        const trendSheet = XLSX.utils.aoa_to_sheet([trendHeader, ...trendData]);
        trendSheet['!cols'] = [{ wch: 10 }, { wch: 15 }, { wch: 15 }, { wch: 15 }];
        XLSX.utils.book_append_sheet(wb, trendSheet, '月度趋势');

        // 3. 支出分类表
        if (yearlyStatsData.expenseByCategory && yearlyStatsData.expenseByCategory.length > 0) {
          const categoryHeader = ['分类', '图标', '金额', '占比'];
          const categoryData = yearlyStatsData.expenseByCategory.map(c => {
            const percent = yearlyStatsData.totalExpense > 0
              ? ((parseFloat(c.total) / yearlyStatsData.totalExpense) * 100).toFixed(1) + '%'
              : '0%';
            return [c.category_name, c.category_icon, parseFloat(c.total), percent];
          });
          const categorySheet = XLSX.utils.aoa_to_sheet([categoryHeader, ...categoryData]);
          categorySheet['!cols'] = [{ wch: 15 }, { wch: 10 }, { wch: 15 }, { wch: 10 }];
          XLSX.utils.book_append_sheet(wb, categorySheet, '支出分类');
        }

        // 下载
        const fileName = `${currentYear}年统计分析_${new Date().toISOString().slice(0, 10)}.xlsx`;
        XLSX.writeFile(wb, fileName);
        showToast('导出成功', 'success');

      } catch (e) {
        console.error('导出Excel失败:', e);
        showToast('导出失败', 'error');
      }
    }

    // ============ Initialize ============
    document.addEventListener('DOMContentLoaded', () => {
      initYearSelector();
      loadData();
    });
  </script>
</body>
</html>
