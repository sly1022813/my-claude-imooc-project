<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>统计报表 - 轻记账</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#9b3f5a",
            "income-mint": "#7ED7C1",
            "expense-coral": "#FF6B6B",
            "pending-amber": "#FFB347",
            "surface-cream": "#FFF5F7",
            "surface-card": "#FFFFFF",
            "border-soft": "#FFE4E8",
            "text-secondary": "#666666",
            "text-muted": "#999999",
            "on-primary": "#ffffff",
            "on-surface": "#1b1c1c",
            "surface-container-lowest": "#ffffff",
            "surface-container": "#f0eded",
            "secondary-fixed": "#ffd9e1",
            "secondary-container": "#fdb2c5",
            "on-secondary-container": "#7a4151",
            "on-surface-variant": "#544245",
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'Space Mono', monospace; }
    .material-symbols-outlined { font-family: 'Material Symbols Outlined'; }
  </style>
</head>
<body class="bg-surface-cream text-on-surface min-h-screen pb-20">
  <!-- Header -->
  <header class="bg-surface-card border-b border-border-soft px-4 py-3 sticky top-0 z-50">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <a href="mine.html" class="p-2 -ml-2 hover:bg-surface-cream rounded-full">
        <span class="material-symbols-outlined text-xl text-on-surface-variant">arrow_back</span>
      </a>
      <h1 class="font-semibold text-lg">统计报表</h1>
      <div class="w-10"></div>
    </div>
  </header>

  <!-- Month Selector -->
  <div class="max-w-2xl mx-auto px-4 py-4">
    <div class="flex items-center justify-center gap-4">
      <button class="p-2 rounded-full hover:bg-surface-card" onclick="changeMonth(-1)">
        <span class="material-symbols-outlined text-xl">chevron_left</span>
      </button>
      <span class="font-semibold text-lg" id="current-month">2024年10月</span>
      <button class="p-2 rounded-full hover:bg-surface-card" onclick="changeMonth(1)">
        <span class="material-symbols-outlined text-xl">chevron_right</span>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <main class="max-w-2xl mx-auto px-4 space-y-4">
    <!-- Summary Cards -->
    <section class="grid grid-cols-2 gap-3">
      <div class="bg-surface-card rounded-xl p-4 border border-border-soft">
        <div class="flex items-center gap-2 mb-2">
          <span class="material-symbols-outlined text-lg text-income-mint">arrow_downward</span>
          <span class="text-xs text-text-secondary">本月收入</span>
        </div>
        <div class="text-xl font-bold font-mono text-income-mint" id="stat-income">¥0.00</div>
      </div>
      <div class="bg-surface-card rounded-xl p-4 border border-border-soft">
        <div class="flex items-center gap-2 mb-2">
          <span class="material-symbols-outlined text-lg text-expense-coral">arrow_outward</span>
          <span class="text-xs text-text-secondary">本月支出</span>
        </div>
        <div class="text-xl font-bold font-mono text-expense-coral" id="stat-expense">¥0.00</div>
      </div>
    </section>

    <!-- Net Profit -->
    <section class="bg-surface-card rounded-xl p-4 border-2 border-primary">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-2xl text-primary">account_balance_wallet</span>
          <span class="font-medium">本月结余</span>
        </div>
        <div class="text-2xl font-bold font-mono text-primary" id="stat-profit">¥0.00</div>
      </div>
    </section>

    <!-- Expense Chart -->
    <section class="bg-surface-card rounded-xl p-4 border border-border-soft">
      <h3 class="font-semibold mb-3">支出分布</h3>
      <div class="h-64">
        <canvas id="expenseChart"></canvas>
      </div>
    </section>

    <!-- Income Chart -->
    <section class="bg-surface-card rounded-xl p-4 border border-border-soft">
      <h3 class="font-semibold mb-3">收入分布</h3>
      <div class="h-64">
        <canvas id="incomeChart"></canvas>
      </div>
    </section>

    <!-- Daily Trend -->
    <section class="bg-surface-card rounded-xl p-4 border border-border-soft">
      <h3 class="font-semibold mb-3">每日收支</h3>
      <div class="h-64">
        <canvas id="dailyChart"></canvas>
      </div>
    </section>

    <!-- Category Breakdown -->
    <section class="bg-surface-card rounded-xl border border-border-soft overflow-hidden">
      <div class="p-4 border-b border-border-soft">
        <h3 class="font-semibold">分类明细</h3>
      </div>
      <div id="category-breakdown">
        <div class="p-8 text-center text-text-muted">
          <span class="material-symbols-outlined text-4xl">pie_chart</span>
          <p class="mt-2">加载中...</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 bg-surface-card border-t border-border-soft">
    <div class="max-w-2xl mx-auto flex justify-around py-2">
      <a href="index.html" class="flex flex-col items-center p-2 text-text-secondary">
        <span class="material-symbols-outlined text-2xl">home</span>
        <span class="text-xs mt-1">首页</span>
      </a>
      <a href="records.html" class="flex flex-col items-center p-2 text-text-secondary">
        <span class="material-symbols-outlined text-2xl">receipt_long</span>
        <span class="text-xs mt-1">记录</span>
      </a>
      <a href="#" class="flex flex-col items-center p-2 -mt-6">
        <div class="w-14 h-14 rounded-full bg-primary flex items-center justify-center shadow-lg">
          <span class="material-symbols-outlined text-3xl text-white">add</span>
        </div>
      </a>
      <a href="customers.html" class="flex flex-col items-center p-2 text-text-secondary">
        <span class="material-symbols-outlined text-2xl">group</span>
        <span class="text-xs mt-1">客户</span>
      </a>
      <a href="mine.html" class="flex flex-col items-center p-2 text-text-secondary">
        <span class="material-symbols-outlined text-2xl">person</span>
        <span class="text-xs mt-1">我的</span>
      </a>
    </div>
  </nav>

  <!-- Toast Container -->
  <div id="toast-container" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none;"></div>

  <!-- Scripts -->
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth() + 1;
    let expenseChart = null;
    let incomeChart = null;
    let dailyChart = null;

    // ============ Toast ============
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgColors = {
        success: 'bg-income-mint',
        error: 'bg-expense-coral',
        warning: 'bg-pending-amber',
        info: 'bg-primary'
      };
      toast.className = `${bgColors[type]} text-white px-4 py-2 rounded-lg shadow-lg text-sm font-medium transition-all duration-300`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // ============ Check Auth ============
    function checkAuth() {
      if (!API.isLoggedIn()) {
        window.location.href = 'login.html';
        return false;
      }
      return true;
    }

    // ============ Month Navigation ============
    function changeMonth(delta) {
      currentMonth += delta;
      if (currentMonth > 12) {
        currentMonth = 1;
        currentYear++;
      } else if (currentMonth < 1) {
        currentMonth = 12;
        currentYear--;
      }
      loadData();
    }

    function getYearMonth() {
      return `${currentYear}-${String(currentMonth).padStart(2, '0')}`;
    }

    // ============ Load Data ============
    async function loadData() {
      if (!checkAuth()) return;

      const yearMonth = getYearMonth();
      document.getElementById('current-month').textContent = `${currentYear}年${currentMonth}月`;

      try {
        // Load monthly stats
        const statsRes = await API.Transaction.getMonthlyStats(yearMonth);
        const stats = statsRes.data;

        document.getElementById('stat-income').textContent = `¥${Utils.formatAmount(stats.totalIncome)}`;
        document.getElementById('stat-expense').textContent = `¥${Utils.formatAmount(stats.totalExpense)}`;
        document.getElementById('stat-profit').textContent = `¥${Utils.formatAmount(stats.netProfit)}`;

        // Load charts
        await Promise.all([
          loadExpenseChart(stats.expenseByCategory),
          loadIncomeChart(stats.incomeByCategory),
          loadDailyChart(),
          loadCategoryBreakdown(stats)
        ]);
      } catch (e) {
        console.error('加载数据失败:', e);
        showToast('加载数据失败', 'error');
      }
    }

    async function loadExpenseChart(data) {
      if (!data || data.length === 0) {
        document.getElementById('expenseChart').parentElement.innerHTML = `
          <div class="h-64 flex items-center justify-center text-text-muted">
            <div class="text-center">
              <span class="material-symbols-outlined text-4xl">pie_chart</span>
              <p class="mt-2">暂无支出数据</p>
            </div>
          </div>
        `;
        return;
      }

      if (expenseChart) expenseChart.destroy();

      const ctx = document.getElementById('expenseChart').getContext('2d');
      expenseChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: data.map(d => d.category_name),
          datasets: [{
            data: data.map(d => d.total),
            backgroundColor: data.map(d => d.category_color || '#FF6B6B'),
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { usePointStyle: true, padding: 15 }
            }
          }
        }
      });
    }

    async function loadIncomeChart(data) {
      if (!data || data.length === 0) {
        document.getElementById('incomeChart').parentElement.innerHTML = `
          <div class="h-64 flex items-center justify-center text-text-muted">
            <div class="text-center">
              <span class="material-symbols-outlined text-4xl">pie_chart</span>
              <p class="mt-2">暂无收入数据</p>
            </div>
          </div>
        `;
        return;
      }

      if (incomeChart) incomeChart.destroy();

      const ctx = document.getElementById('incomeChart').getContext('2d');
      incomeChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: data.map(d => d.category_name),
          datasets: [{
            data: data.map(d => d.total),
            backgroundColor: data.map(d => d.category_color || '#7ED7C1'),
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { usePointStyle: true, padding: 15 }
            }
          }
        }
      });
    }

    async function loadDailyChart() {
      try {
        const res = await API.Transaction.getDailyTrend(30);
        const data = res.data.data;

        if (dailyChart) dailyChart.destroy();

        const ctx = document.getElementById('dailyChart').getContext('2d');
        dailyChart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: data.map(d => d.date.slice(5)),
            datasets: [
              {
                label: '收入',
                data: data.map(d => d.daily_income || 0),
                backgroundColor: '#7ED7C1'
              },
              {
                label: '支出',
                data: data.map(d => d.daily_expense || 0),
                backgroundColor: '#FF6B6B'
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'bottom',
                labels: { usePointStyle: true }
              }
            },
            scales: {
              y: {
                beginAtZero: true,
                ticks: { callback: v => '¥' + v }
              }
            }
          }
        });
      } catch (e) {
        console.error('加载每日趋势失败:', e);
      }
    }

    function loadCategoryBreakdown(stats) {
      const container = document.getElementById('category-breakdown');

      let html = '';

      // Expense breakdown
      if (stats.expenseByCategory && stats.expenseByCategory.length > 0) {
        html += `
          <div class="p-4 border-b border-border-soft">
            <div class="flex items-center gap-2 mb-3">
              <span class="material-symbols-outlined text-expense-coral">arrow_outward</span>
              <span class="font-medium text-expense-coral">支出分类</span>
            </div>
            ${stats.expenseByCategory.map(c => {
              const percent = stats.totalExpense > 0 ? (c.total / stats.totalExpense * 100).toFixed(1) : 0;
              return `
                <div class="flex items-center gap-3 py-2">
                  <span class="text-xl">${c.category_icon}</span>
                  <div class="flex-1">
                    <div class="flex justify-between text-sm mb-1">
                      <span>${c.category_name}</span>
                      <span class="font-mono">¥${Utils.formatAmount(c.total)}</span>
                    </div>
                    <div class="h-2 bg-surface-cream rounded-full overflow-hidden">
                      <div class="h-full bg-expense-coral rounded-full" style="width: ${percent}%"></div>
                    </div>
                  </div>
                  <span class="text-xs text-text-muted w-12 text-right">${percent}%</span>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      // Income breakdown
      if (stats.incomeByCategory && stats.incomeByCategory.length > 0) {
        html += `
          <div class="p-4">
            <div class="flex items-center gap-2 mb-3">
              <span class="material-symbols-outlined text-income-mint">arrow_downward</span>
              <span class="font-medium text-income-mint">收入分类</span>
            </div>
            ${stats.incomeByCategory.map(c => {
              const percent = stats.totalIncome > 0 ? (c.total / stats.totalIncome * 100).toFixed(1) : 0;
              return `
                <div class="flex items-center gap-3 py-2">
                  <span class="text-xl">${c.category_icon}</span>
                  <div class="flex-1">
                    <div class="flex justify-between text-sm mb-1">
                      <span>${c.category_name}</span>
                      <span class="font-mono">¥${Utils.formatAmount(c.total)}</span>
                    </div>
                    <div class="h-2 bg-surface-cream rounded-full overflow-hidden">
                      <div class="h-full bg-income-mint rounded-full" style="width: ${percent}%"></div>
                    </div>
                  </div>
                  <span class="text-xs text-text-muted w-12 text-right">${percent}%</span>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      if (!html) {
        html = `
          <div class="p-8 text-center text-text-muted">
            <span class="material-symbols-outlined text-4xl">pie_chart</span>
            <p class="mt-2">暂无分类数据</p>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    // ============ Initialize ============
    document.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
