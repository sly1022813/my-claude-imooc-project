<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>明细 - 轻记账</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#9b3f5a",
            "income-mint": "#7ED7C1",
            "expense-coral": "#FF6B6B",
            "pending-amber": "#FFB347",
            "surface-cream": "#FFF5F7",
            "surface-card": "#FFFFFF",
            "border-soft": "#FFE4E8",
            "text-secondary": "#666666",
            "text-muted": "#999999",
            "on-primary": "#ffffff",
            "on-surface": "#1b1c1c",
            "surface-container-lowest": "#ffffff",
            "surface-container": "#f0eded",
            "secondary-fixed": "#ffd9e1",
            "secondary-container": "#fdb2c5",
            "on-secondary-container": "#7a4151",
            "on-surface-variant": "#544245",
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'Space Mono', monospace; }
    .material-symbols-outlined { font-family: 'Material Symbols Outlined'; }
  </style>
</head>
<body class="bg-surface-cream text-on-surface min-h-screen pb-20">
  <!-- Header -->
  <header class="bg-surface-card border-b border-border-soft px-4 py-3 sticky top-0 z-50">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <a href="index.html" class="p-2 -ml-2 hover:bg-surface-cream rounded-full">
        <span class="material-symbols-outlined text-xl text-on-surface-variant">arrow_back</span>
      </a>
      <h1 class="font-semibold text-lg">明细</h1>
      <div class="w-10"></div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-2xl mx-auto px-4 py-4 space-y-4">
    <!-- Year & Type Filter -->
    <div class="flex items-center gap-3">
      <!-- Year Selector -->
      <select id="year-filter" class="flex-1 h-12 px-4 rounded-lg bg-surface-card border border-border-soft outline-none text-center font-medium">
        <!-- 由JS生成 -->
      </select>

      <!-- Type Filter -->
      <div class="flex-1 flex rounded-lg bg-surface-card border border-border-soft overflow-hidden">
        <button class="type-btn flex-1 py-3 text-sm font-medium border-r border-border-soft last:border-r-0" data-type="" onclick="selectType(this)">全部</button>
        <button class="type-btn flex-1 py-3 text-sm font-medium border-r border-border-soft last:border-r-0 text-expense-coral" data-type="1" onclick="selectType(this)">支出</button>
        <button class="type-btn flex-1 py-3 text-sm font-medium text-income-mint" data-type="2" onclick="selectType(this)">收入</button>
      </div>
    </div>

    <!-- Records List Grouped by Month -->
    <section class="bg-surface-card rounded-xl border border-border-soft overflow-hidden" id="records-container">
      <div class="p-8 text-center text-text-muted">
        <span class="material-symbols-outlined text-4xl animate-pulse">hourglass_empty</span>
        <p class="mt-2">加载中...</p>
      </div>
    </section>

    <!-- Load More -->
    <div class="text-center" id="load-more-container" style="display: none;">
      <button class="px-6 py-2 rounded-full bg-surface-card border border-border-soft text-sm" onclick="loadMore()">
        加载更多
      </button>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 bg-surface-card border-t border-border-soft">
    <div class="max-w-2xl mx-auto flex justify-around py-2">
      <a href="index.html" class="flex flex-col items-center p-2 text-text-secondary">
        <span class="material-symbols-outlined text-2xl">home</span>
        <span class="text-xs mt-1">首页</span>
      </a>
      <a href="records.html" class="flex flex-col items-center p-2 text-primary">
        <span class="material-symbols-outlined text-2xl">receipt_long</span>
        <span class="text-xs mt-1">明细</span>
      </a>
      <a href="#" class="flex flex-col items-center p-2 -mt-6">
        <div class="w-14 h-14 rounded-full bg-primary flex items-center justify-center shadow-lg">
          <span class="material-symbols-outlined text-3xl text-white">add</span>
        </div>
      </a>
      <a href="customers.html" class="flex flex-col items-center p-2 text-text-secondary">
        <span class="material-symbols-outlined text-2xl">group</span>
        <span class="text-xs mt-1">客户</span>
      </a>
      <a href="mine.html" class="flex flex-col items-center p-2 text-text-secondary">
        <span class="material-symbols-outlined text-2xl">person</span>
        <span class="text-xs mt-1">我的</span>
      </a>
    </div>
  </nav>

  <!-- Detail Modal -->
  <div id="detail-modal" class="fixed inset-0 bg-black/50 z-50 hidden">
    <div class="absolute bottom-0 left-0 right-0 bg-surface-card rounded-t-2xl max-h-[90vh] overflow-y-auto">
      <div class="sticky top-0 bg-surface-card p-4 border-b border-border-soft flex items-center justify-between">
        <h3 class="font-semibold text-lg">记录详情</h3>
        <button onclick="closeDetailModal()" class="p-2 hover:bg-surface-cream rounded-full">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="p-4" id="detail-content"></div>
      <div class="sticky bottom-0 bg-surface-card p-4 border-t border-border-soft flex gap-3">
        <button class="flex-1 h-12 rounded-xl bg-expense-coral text-white font-semibold" onclick="deleteRecord()">删除</button>
        <button class="flex-1 h-12 rounded-xl bg-primary text-white font-semibold" onclick="editRecord()">编辑</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none;"></div>

  <!-- Scripts -->
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    let currentYear = new Date().getFullYear();
    let currentType = ''; // '', 1=支出, 2=收入
    let currentPage = 1;
    let pageSize = 50;
    let totalRecords = [];
    let hasMore = false;
    let currentRecordId = null;

    // ============ Toast ============
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgColors = {
        success: 'bg-income-mint',
        error: 'bg-expense-coral',
        warning: 'bg-pending-amber',
        info: 'bg-primary'
      };
      toast.className = `${bgColors[type]} text-white px-4 py-2 rounded-lg shadow-lg text-sm font-medium transition-all duration-300`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // ============ Check Auth ============
    function checkAuth() {
      if (!API.isLoggedIn()) {
        window.location.href = 'login.html';
        return false;
      }
      return true;
    }

    // ============ Init ============
    function initYearSelector() {
      const select = document.getElementById('year-filter');
      const currentYear = new Date().getFullYear();
      let options = '';
      for (let y = currentYear; y >= currentYear - 5; y--) {
        options += `<option value="${y}" ${y === currentYear ? 'selected' : ''}>${y}年</option>`;
      }
      select.innerHTML = options;

      // 默认选中"全部"
      document.querySelector('.type-btn[data-type=""]').classList.add('bg-primary', 'text-white');
    }

    function selectType(btn) {
      document.querySelectorAll('.type-btn').forEach(b => {
        b.classList.remove('bg-primary', 'text-white', 'bg-surface-cream');
      });
      btn.classList.add('bg-primary', 'text-white');
      currentType = btn.dataset.type;
      currentPage = 1;
      totalRecords = [];
      loadData();
    }

    // ============ Load Data ============
    async function loadData() {
      if (!checkAuth()) return;

      currentYear = parseInt(document.getElementById('year-filter').value);
      const container = document.getElementById('records-container');

      container.innerHTML = `
        <div class="p-8 text-center text-text-muted">
          <span class="material-symbols-outlined text-4xl animate-pulse">hourglass_empty</span>
          <p class="mt-2">加载中...</p>
        </div>
      `;

      try {
        const params = {
          page: currentPage,
          pageSize: pageSize
        };

        if (currentType) params.type = currentType;

        const res = await API.Transaction.getYearlyList(currentYear, params);
        const { list, pagination } = res.data;

        if (currentPage === 1) {
          totalRecords = list;
        } else {
          totalRecords = [...totalRecords, ...list];
        }

        hasMore = currentPage < pagination.totalPages;

        renderRecords();
        updateLoadMoreButton();

      } catch (e) {
        console.error('加载记录失败:', e);
        container.innerHTML = `
          <div class="p-8 text-center text-expense-coral">
            <span class="material-symbols-outlined text-4xl">error</span>
            <p class="mt-2">加载失败: ${e.message}</p>
          </div>
        `;
      }
    }

    function renderRecords() {
      const container = document.getElementById('records-container');

      if (totalRecords.length === 0) {
        container.innerHTML = `
          <div class="p-8 text-center text-text-muted">
            <span class="material-symbols-outlined text-4xl">receipt_long</span>
            <p class="mt-2">暂无记录</p>
          </div>
        `;
        return;
      }

      // 按月份分组
      const grouped = {};
      totalRecords.forEach(tx => {
        const month = tx.date.slice(0, 7); // YYYY-MM
        if (!grouped[month]) {
          grouped[month] = [];
        }
        grouped[month].push(tx);
      });

      // 排序月份（降序）
      const sortedMonths = Object.keys(grouped).sort((a, b) => b.localeCompare(a));

      container.innerHTML = sortedMonths.map(month => {
        const monthName = month + '月';
        const records = grouped[month];

        // 计算当月收支小计
        let monthIncome = 0, monthExpense = 0;
        records.forEach(r => {
          if (r.type === 2) monthIncome += parseFloat(r.amount);
          else monthExpense += parseFloat(r.amount);
        });

        return `
          <div class="mb-4 last:mb-0">
            <!-- Month Header -->
            <div class="sticky top-[120px] z-10 bg-surface-cream/95 backdrop-blur px-4 py-2 border-b border-border-soft">
              <div class="flex justify-between items-center">
                <span class="font-semibold text-sm">${monthName}</span>
                <div class="flex gap-4 text-xs">
                  <span class="text-income-mint">收 ¥${Utils.formatAmount(monthIncome)}</span>
                  <span class="text-expense-coral">支 ¥${Utils.formatAmount(monthExpense)}</span>
                </div>
              </div>
            </div>
            <!-- Records -->
            <div class="divide-y divide-border-soft">
              ${records.map(tx => `
                <div class="p-4 flex items-center gap-3 hover:bg-surface-cream/50 cursor-pointer transition-colors" onclick="showDetail(${tx.id})">
                  <div class="w-12 h-12 rounded-full flex items-center justify-center text-xl" style="background-color: ${tx.category_color}20">
                    ${tx.category_icon}
                  </div>
                  <div class="flex-1 min-w-0">
                    <div class="font-medium truncate">${tx.category_name}</div>
                    <div class="text-xs text-text-muted flex items-center gap-2">
                      ${tx.date}
                      ${tx.payment_method_name ? `<span>· ${tx.payment_method_name}</span>` : ''}
                      ${tx.status === 2 ? '<span class="text-pending-amber">待收/待付</span>' : ''}
                    </div>
                  </div>
                  <div class="text-right">
                    <div class="font-mono font-semibold ${tx.type === 1 ? 'text-expense-coral' : 'text-income-mint'}">
                      ${tx.type === 1 ? '-' : '+'}¥${Utils.formatAmount(tx.amount)}
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function updateLoadMoreButton() {
      const container = document.getElementById('load-more-container');
      container.style.display = hasMore ? 'block' : 'none';
    }

    function loadMore() {
      currentPage++;
      loadData();
    }

    // ============ Detail Modal ============
    async function showDetail(id) {
      currentRecordId = id;

      try {
        const res = await API.Transaction.getById(id);
        const tx = res.data;

        document.getElementById('detail-content').innerHTML = `
          <div class="text-center py-6">
            <div class="w-16 h-16 rounded-full mx-auto flex items-center justify-center text-3xl mb-3" style="background-color: ${tx.category_color}20">
              ${tx.category_icon}
            </div>
            <div class="text-3xl font-bold font-mono ${tx.type === 1 ? 'text-expense-coral' : 'text-income-mint'}">
              ${tx.type === 1 ? '-' : '+'}¥${Utils.formatAmount(tx.amount)}
            </div>
            <div class="text-sm text-text-muted mt-1">${tx.category_name}</div>
          </div>

          <div class="space-y-3">
            <div class="flex justify-between py-2 border-b border-border-soft">
              <span class="text-text-secondary">日期</span>
              <span>${tx.date}</span>
            </div>
            <div class="flex justify-between py-2 border-b border-border-soft">
              <span class="text-text-secondary">类型</span>
              <span class="${tx.type === 1 ? 'text-expense-coral' : 'text-income-mint'}">${tx.type === 1 ? '支出' : '收入'}</span>
            </div>
            <div class="flex justify-between py-2 border-b border-border-soft">
              <span class="text-text-secondary">支付方式</span>
              <span>${tx.payment_method_name || '其他'}</span>
            </div>
            <div class="flex justify-between py-2 border-b border-border-soft">
              <span class="text-text-secondary">状态</span>
              <span class="${tx.status === 1 ? 'text-income-mint' : 'text-pending-amber'}">${tx.status === 1 ? '已收付' : '待收/待付'}</span>
            </div>
            ${tx.counterparty ? `
            <div class="flex justify-between py-2 border-b border-border-soft">
              <span class="text-text-secondary">${tx.counterparty_type === 1 ? '客户' : tx.counterparty_type === 2 ? '供应商' : '对方'}</span>
              <span>${tx.counterparty}</span>
            </div>
            ` : ''}
            ${tx.remark ? `
            <div class="flex justify-between py-2 border-b border-border-soft">
              <span class="text-text-secondary">备注</span>
              <span class="text-right max-w-[60%]">${tx.remark}</span>
            </div>
            ` : ''}
            <div class="flex justify-between py-2">
              <span class="text-text-secondary">创建时间</span>
              <span class="text-text-muted text-sm">${tx.created_at}</span>
            </div>
          </div>
        `;

        document.getElementById('detail-modal').classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      } catch (e) {
        showToast('加载详情失败', 'error');
      }
    }

    function closeDetailModal() {
      document.getElementById('detail-modal').classList.add('hidden');
      document.body.style.overflow = '';
      currentRecordId = null;
    }

    async function editRecord() {
      if (!currentRecordId) return;
      closeDetailModal();
      window.location.href = `index.html?edit=${currentRecordId}`;
    }

    async function deleteRecord() {
      if (!currentRecordId) return;

      const confirmed = await Utils.confirm('确定要删除这条记录吗？');
      if (!confirmed) return;

      try {
        await API.Transaction.delete(currentRecordId);
        showToast('删除成功', 'success');
        closeDetailModal();
        loadData();
      } catch (e) {
        showToast('删除失败: ' + e.message, 'error');
      }
    }

    // ============ Initialize ============
    document.addEventListener('DOMContentLoaded', () => {
      initYearSelector();
      loadData();

      // 年份切换
      document.getElementById('year-filter').addEventListener('change', () => {
        currentPage = 1;
        totalRecords = [];
        loadData();
      });
    });
  </script>
</body>
</html>
