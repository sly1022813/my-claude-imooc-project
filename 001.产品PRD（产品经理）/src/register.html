<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#FF8FAB">
    <title>注册 - 轻记账</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #FFE4EC 0%, #FFF5F7 50%, #FFF0F5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-container {
            width: 100%;
            max-width: 360px;
            padding: 20px;
        }

        .register-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .register-logo .logo-icon {
            font-size: 48px;
            margin-bottom: 8px;
        }

        .register-logo h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 4px;
        }

        .register-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 28px 20px;
            box-shadow: 0 8px 32px var(--shadow-pink);
        }

        .register-title {
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .register-form .form-group {
            margin-bottom: 16px;
        }

        .register-form .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .register-form .form-group input,
        .register-form .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-primary);
            background: var(--bg-primary);
            transition: all 0.2s ease;
        }

        .register-form .form-group input:focus,
        .register-form .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
        }

        .register-form .form-group input::placeholder {
            color: var(--text-muted);
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 16px var(--shadow-pink);
            transition: all 0.2s ease;
        }

        .btn-register:active {
            transform: scale(0.98);
        }

        .btn-register:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .register-footer {
            text-align: center;
            margin-top: 20px;
        }

        .register-footer a {
            color: var(--primary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }

        .register-footer a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #FF6B6B;
            font-size: 12px;
            margin-top: 6px;
            text-align: center;
        }

        .success-message {
            color: var(--income);
            font-size: 13px;
            margin-top: 6px;
            text-align: center;
        }

        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .user-type-selector {
            display: flex;
            gap: 8px;
        }

        .user-type-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--bg-primary);
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .user-type-btn.selected {
            border-color: var(--primary);
            background: rgba(255, 143, 171, 0.1);
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-logo">
            <div class="logo-icon">💕</div>
            <h1>轻记账</h1>
        </div>

        <div class="register-card">
            <h2 class="register-title">创建账号</h2>

            <form class="register-form" id="register-form">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="username" placeholder="3-20位字母数字组合" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" placeholder="至少6位字符" autocomplete="new-password" required>
                </div>

                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="confirm-password" placeholder="请再次输入密码" autocomplete="new-password" required>
                </div>

                <div class="form-group">
                    <label>用户类型</label>
                    <div class="user-type-selector">
                        <button type="button" class="user-type-btn selected" data-type="1" onclick="selectUserType(1)">个人</button>
                        <button type="button" class="user-type-btn" data-type="2" onclick="selectUserType(2)">个体户</button>
                        <button type="button" class="user-type-btn" data-type="3" onclick="selectUserType(3)">企业</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>昵称（可选）</label>
                    <input type="text" id="nickname" placeholder="给自己起个昵称">
                </div>

                <div id="error-message" class="error-message" style="display: none;"></div>
                <div id="success-message" class="success-message" style="display: none;"></div>

                <button type="submit" class="btn-register" id="register-btn">
                    注册
                </button>
            </form>

            <div class="register-footer">
                <a href="login.html">已有账号？立即登录</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api';
        let selectedUserType = 1;

        // 检查是否已登录
        if (localStorage.getItem('token')) {
            window.location.href = 'index.html';
        }

        function selectUserType(type) {
            selectedUserType = type;
            document.querySelectorAll('.user-type-btn').forEach(btn => {
                btn.classList.toggle('selected', parseInt(btn.dataset.type) === type);
            });
        }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const nickname = document.getElementById('nickname').value.trim();
            const errorEl = document.getElementById('error-message');
            const successEl = document.getElementById('success-message');
            const btn = document.getElementById('register-btn');

            // 验证
            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            if (!username) {
                errorEl.textContent = '请输入用户名';
                errorEl.style.display = 'block';
                return;
            }

            if (!/^[a-zA-Z][a-zA-Z0-9]{2,19}$/.test(username)) {
                errorEl.textContent = '用户名需为3-20位字母数字组合，字母开头';
                errorEl.style.display = 'block';
                return;
            }

            if (password.length < 6) {
                errorEl.textContent = '密码长度不能少于6位';
                errorEl.style.display = 'block';
                return;
            }

            if (password !== confirmPassword) {
                errorEl.textContent = '两次输入的密码不一致';
                errorEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>注册中...';

            try {
                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username,
                        password,
                        confirmPassword,
                        userType: selectedUserType,
                        nickname: nickname || username
                    })
                });

                const data = await response.json();

                if (data.success) {
                    successEl.textContent = '🎉 注册成功！正在跳转...';
                    successEl.style.display = 'block';

                    // 保存token和用户信息
                    localStorage.setItem('token', data.data.token);
                    localStorage.setItem('user', JSON.stringify(data.data.user));

                    // 跳转到首页
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    errorEl.textContent = data.message || '注册失败';
                    errorEl.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = '注册';
                }
            } catch (err) {
                console.error('注册请求失败:', err);
                errorEl.textContent = '网络错误，请检查服务器是否启动';
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = '注册';
            }
        });
    </script>
</body>
</html>
